name: Build CVP Linux

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  # ============================================================
  # Native x86_64
  # ============================================================

  build-x64:
    name: Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc libssl-dev

      - name: Build
        run: |
          mkdir -p bin

          gcc \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-x64 \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-x64
          ./bin/cvp-linux-x64 --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-x64
          path: bin/cvp-linux-x64


  # ============================================================
  # Native ARM64
  # ============================================================

  build-arm64:
    name: Linux ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc libssl-dev

      - name: Build
        run: |
          mkdir -p bin

          gcc \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-arm64 \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-arm64
          ./bin/cvp-linux-arm64 --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-arm64
          path: bin/cvp-linux-arm64


  # ============================================================
  # ARMv7
  # ============================================================

  build-armv7:
    name: Linux ARMv7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARMv7 toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            gcc-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            libssl-dev

      - name: Build
        run: |
          mkdir -p bin

          arm-linux-gnueabihf-gcc \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-armv7 \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-armv7

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-armv7
          path: bin/cvp-linux-armv7


  # ============================================================
  # i386
  # ============================================================

  build-i386:
    name: Linux i386
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update

          sudo apt install -y \
            gcc-multilib \
            libssl-dev:i386

      - name: Build
        run: |
          mkdir -p bin

          gcc \
            -m32 \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-i386 \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-i386

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-i386
          path: bin/cvp-linux-i386


  # ============================================================
  # RISC-V 64
  # ============================================================

  build-riscv64:
    name: Linux RISC-V 64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            libssl-dev

      - name: Build
        run: |
          mkdir -p bin

          riscv64-linux-gnu-gcc \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-riscv64 \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-riscv64

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-riscv64
          path: bin/cvp-linux-riscv64


  # ============================================================
  # PowerPC 64 LE
  # ============================================================

  build-ppc64le:
    name: Linux PPC64LE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            gcc-powerpc64le-linux-gnu \
            libc6-dev-ppc64el-cross \
            libssl-dev

      - name: Build
        run: |
          mkdir -p bin

          powerpc64le-linux-gnu-gcc \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-ppc64le \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-ppc64le

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-ppc64le
          path: bin/cvp-linux-ppc64le


  # ============================================================
  # IBM Z / s390x
  # ============================================================

  build-s390x:
    name: Linux s390x
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            gcc-s390x-linux-gnu \
            libc6-dev-s390x-cross \
            libssl-dev

      - name: Build
        run: |
          mkdir -p bin

          s390x-linux-gnu-gcc \
            -O2 \
            ./cliLINUX.c \
            -o ./bin/cvp-linux-s390x \
            -lcrypto

      - name: Check
        run: |
          file ./bin/cvp-linux-s390x

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-s390x
          path: bin/cvp-linux-s390x


  # ============================================================
  # Collect everything
  # ============================================================

  collect:
    name: Collect binaries
    runs-on: ubuntu-latest

    needs:
      - build-x64
      - build-arm64
      - build-armv7
      - build-i386
      - build-riscv64
      - build-ppc64le
      - build-s390x

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Show files
        run: |
          find release -type f -exec file {} \;

      - name: Create release archive
        run: |
          cd release

          mkdir -p final

          cp cvp-linux-x64/cvp-linux-x64 \
             final/cvp-linux-x64

          cp cvp-linux-arm64/cvp-linux-arm64 \
             final/cvp-linux-arm64

          cp cvp-linux-armv7/cvp-linux-armv7 \
             final/cvp-linux-armv7

          cp cvp-linux-i386/cvp-linux-i386 \
             final/cvp-linux-i386

          cp cvp-linux-riscv64/cvp-linux-riscv64 \
             final/cvp-linux-riscv64

          cp cvp-linux-ppc64le/cvp-linux-ppc64le \
             final/cvp-linux-ppc64le

          cp cvp-linux-s390x/cvp-linux-s390x \
             final/cvp-linux-s390x

          tar -czf ../cvp-linux-all.tar.gz -C final .

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: cvp-linux-all
          path: cvp-linux-all.tar.gz